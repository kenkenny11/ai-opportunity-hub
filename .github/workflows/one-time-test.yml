name: One-Time AI Opportunity Hub Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run automation now
        env:
          HUB_URL: https://ai-opportunity-hub.onrender.com
        run: |
          set -e
          curl --fail --show-error --silent --location \
            --max-time 180 \
            --retry 3 \
            --retry-delay 10 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-automation-trigger: github-actions" \
            "$HUB_URL/api/automation/run"
          echo
