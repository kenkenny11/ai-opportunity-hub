name: AI Opportunity Hub Automation

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render and run automation
        env:
          HUB_URL: https://ai-opportunity-hub.onrender.com
        run: |
          set -e
          echo "Triggering AI Opportunity Hub automation..."
          curl --fail --show-error --silent --location \
            --max-time 180 \
            --retry 3 \
            --retry-delay 10 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-automation-trigger: github-actions" \
            "$HUB_URL/api/automation/run"
          echo
          echo "Automation trigger completed."
