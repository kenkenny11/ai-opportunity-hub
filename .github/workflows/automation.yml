name: AI Opportunity Hub Hourly Automation

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Render service
        run: sleep 90

      - name: Run immediate Futurepedia auto-publish test
        env:
          HUB_URL: https://ai-opportunity-hub.onrender.com
        run: |
          set -e
          echo "Running immediate AI Opportunity Hub auto-publish test..."
          curl --fail --show-error --silent --location \
            --max-time 180 \
            --retry 3 \
            --retry-delay 10 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-automation-trigger: github-actions" \
            "$HUB_URL/api/automation/run"
          echo
          echo "Auto-publish test completed."

      - name: Verify Telegram growth engine
        env:
          HUB_URL: https://ai-opportunity-hub.onrender.com
        run: |
          set -e
          echo "Checking Telegram bot/channel growth engine..."
          curl --fail --show-error --silent --location             --max-time 60             --retry 3             --retry-delay 5             "$HUB_URL/api/growth/health"
          echo
          echo "Growth engine health check completed."
