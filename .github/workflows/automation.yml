name: AI Opportunity Hub Hourly Automation

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Render service
        run: sleep 90

      - name: Run hourly Futurepedia automation
        if: "!contains(github.event.head_commit.message, 'Restore hourly schedule')"
        env:
          HUB_URL: https://ai-opportunity-hub.onrender.com
        run: |
          set -e
          echo "Running AI Opportunity Hub hourly automation..."
          curl --fail --show-error --silent --location \
            --max-time 180 \
            --retry 3 \
            --retry-delay 10 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-automation-trigger: github-actions" \
            "$HUB_URL/api/automation/run"
          echo
          echo "Hourly automation completed."
